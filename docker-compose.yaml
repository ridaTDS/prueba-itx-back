version: "3.3"
services:
  influxdb:
    image: influxdb:1.8.2
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
  grafana:
    image: grafana/grafana:8.1.2
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./shared/grafana:/etc/grafana/provisioning/
  simulado:
    image : ldabiralai/simulado:latest
    ports:
      - "3001:80"
    volumes:
      - ./shared/simulado:/app
    command: ./bin/simulado -f /app/mocks.json
  k6:
    image: loadimpact/k6:0.28.0
    ports:
      - "6565:6565"
    volumes:
      - ./shared/k6:/scripts
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
  # Servidor de identidad: emite los JWT que exige el API
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # El emisor ("iss") de los tokens es siempre localhost:8080, se pidan desde el host o desde Docker
      - KC_HOSTNAME=http://localhost:8080
      - KC_HTTP_ENABLED=true
    volumes:
      - ./keycloak:/opt/keycloak/data/import
  # Aplicación (opcional: también se puede arrancar en local con `mvn spring-boot:run`)
  similar-products:
    build: .
    ports:
      - "5000:5000"
    environment:
      - EXISTING_APIS_BASE_URL=http://simulado:80
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/itx/protocol/openid-connect/certs
    depends_on:
      - simulado
      - keycloak
